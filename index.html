<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>معركة السفن</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent
}

body{
    margin:0;
    min-height:100vh;
    background:#07131d;
    background-image:url("sea.png");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center
}

button,input{font:inherit}

button{
    border:0;
    border-radius:12px;
    padding:13px 20px;
    margin:6px;
    color:white;
    background:#1266a8;
    cursor:pointer;
    font-weight:bold
}

button:hover{background:#1684d4}
button:active{transform:scale(.96)}
button:disabled{opacity:.55;cursor:not-allowed}
button.back{background:#6b2935}
button.success{background:#16834a}
button.warning{background:#9a6b16}

.screen{
    display:none;
    min-height:100vh;
    padding:25px 15px;
    align-items:center;
    justify-content:center;
    flex-direction:column
}

.screen.active{display:flex}

.panel{
    width:100%;
    max-width:430px;
    padding:25px;
    border-radius:20px;
    background:#0d2233;
    box-shadow:0 0 25px #0008
}

h1{color:#38bdf8}
h2{color:#7dd3fc}

.menu-buttons{
    display:flex;
    flex-direction:column;
    gap:8px
}

.menu-buttons button{
    width:100%;
    margin:0
}

input{
    width:100%;
    padding:13px;
    margin:8px 0;
    border:1px solid #28516d;
    border-radius:10px;
    background:#07131d;
    color:white;
    text-align:center;
    outline:none
}

.status{
    min-height:25px;
    margin:12px 0;
    color:#facc15
}

.online-count{
    width:100%;
    padding:11px;
    margin-top:10px;
    border-radius:12px;
    background:#12364e;
    color:#b8e7ff;
    font-weight:bold;
    border:1px solid #28516d
}

/* GAME */

.game-screen-content{
    width:100%;
    max-width:500px;
    display:flex;
    flex-direction:column;
    align-items:center
}

.game-top{
    width:100%;
    max-width:430px
}

.game-title{
    margin:5px 0 10px;
    color:#38bdf8
}

.preparation-box{
    width:100%;
    margin-bottom:8px
}

.timer{
    font-size:28px;
    font-weight:bold;
    color:#facc15;
    margin:8px
}

.map-title{
    margin:7px 0 10px;
    color:#7dd3fc
}

.board-container{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%
}

.board{
    display:grid;
    grid-template-columns:repeat(10,1fr);
    width:min(94vw,420px);
    aspect-ratio:1;
    border:2px solid #2384bd;
    background:#0a2b43;
    box-shadow:0 8px 25px #0006;
    border-radius:5px;
    overflow:hidden
}

.cell{
    border:1px solid #174b68;
    background:#16834a;
    position:relative;
    transition:
        background .15s,
        transform .15s,
        box-shadow .15s,
        border .15s
}

/* =========================
   SHIPS TOP VIEW
========================= */

.cell.ship{
    background:
        linear-gradient(
            90deg,
            #111b22 0%,
            #344b59 12%,
            #8299a6 42%,
            #536b79 70%,
            #17242c 100%
        );
    box-shadow:
        inset 0 0 5px #c1d0d7,
        inset 0 -4px 5px #0b1116
}

.cell.ship::before{
    content:"";
    position:absolute;
    left:12%;
    right:12%;
    top:4%;
    bottom:4%;
    border-radius:48% 48% 35% 35%;
    background:
        linear-gradient(
            90deg,
            #263a46,
            #a9bac2 43%,
            #536b78 75%,
            #263943
        );
    box-shadow:
        inset 2px 0 3px #d4e0e5,
        inset -2px 0 3px #142029
}

.cell.ship::after{
    content:"";
    position:absolute;
    left:43%;
    right:43%;
    top:15%;
    bottom:15%;
    background:#1c303b;
    border-radius:4px
}

.cell.ship.ship4::before{
    left:6%;
    right:6%
}

.cell.ship.ship3::before{
    left:9%;
    right:9%
}

.cell.ship.ship2::before{
    left:16%;
    right:16%
}

.cell.ship.horizontal::before{
    top:15%;
    bottom:15%;
    left:4%;
    right:4%;
    border-radius:45% 45% 35% 35%
}

.cell.ship.horizontal::after{
    top:42%;
    bottom:42%;
    left:14%;
    right:14%
}

.cell.ship.horizontal.ship4::before{
    left:2%;
    right:2%
}

.cell.ship.horizontal.ship2::before{
    left:5%;
    right:5%
}

/* =========================
   ATTACK COLORS
========================= */

/* إصابة */
.cell.hit{
    background:#b91c1c !important;
    animation:hit .35s;
    box-shadow:
        inset 0 0 0 2px #ef4444,
        0 0 8px #ef444466
}

/* إصابة فوق السفينة */
.cell.ship.hit{
    background:#b91c1c !important;
}

.cell.hit::after{
    content:"✕";
    color:white;
    font-size:20px;
    font-weight:bold;
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:10;
    text-shadow:0 1px 3px #000
}

/* استهداف بدون إصابة */
.cell.miss{
    background:#eab308 !important;
    box-shadow:
        inset 0 0 0 2px #facc15,
        0 0 7px #facc1555
}

.cell.miss::after{
    content:"•";
    color:#fff;
    font-size:28px;
    font-weight:bold;
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:10
}

/* هجوم اللاعب على الخصم */
.cell.target-hit{
    background:#b91c1c !important;
    box-shadow:
        inset 0 0 0 2px #ef4444,
        0 0 8px #ef444455
}

.cell.target-hit::after{
    content:"✕";
    color:white;
    font-size:20px;
    font-weight:bold;
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:12
}

.cell.target-miss{
    background:#eab308 !important;
    box-shadow:
        inset 0 0 0 2px #facc15,
        0 0 7px #facc1555
}

.cell.target-miss::after{
    content:"•";
    color:white;
    font-size:28px;
    font-weight:bold;
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:12
}

/* =========================
   TARGET SELECTION
========================= */

.cell.attackable{
    cursor:pointer
}

.cell.attackable:hover{
    background:#20a65a;
    transform:scale(.94);
    z-index:2
}

.cell.selected-target{
    background:#d89408 !important;
    border:2px solid white !important;
    box-shadow:
        0 0 10px #facc15,
        inset 0 0 8px #fff8;
    transform:scale(.94);
    z-index:20;
    animation:selectedPulse .8s infinite alternate
}

.cell.selected-target::before{
    content:"";
    position:absolute;
    inset:18%;
    border:2px solid white;
    border-radius:50%;
    z-index:20;
    background:transparent
}

.cell.selected-target::after{
    content:"✓";
    color:white;
    font-size:18px;
    font-weight:bold;
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:21
}

.cell.bomb-preview{
    outline:2px solid #facc15;
    z-index:15
}

/* =========================
   CONTROLS
========================= */

.placement-controls{
    margin-top:12px;
    width:100%
}

.placement-controls button{margin:4px}

.battle-controls{
    width:100%;
    max-width:500px;
    margin-top:15px;
    padding:12px;
    border-radius:18px;
    background:#0d2233;
    box-shadow:0 -4px 20px #0005
}

.weapons{
    width:100%;
    display:flex;
    gap:8px;
    justify-content:center
}

.weapon{
    flex:1;
    min-height:70px;
    background:#12364e;
    border:2px solid #28516d;
    padding:10px;
    border-radius:14px;
    cursor:pointer;
    transition:.15s
}

.weapon:active{transform:scale(.96)}

.weapon.selected{
    border-color:#facc15;
    background:#19506d;
    box-shadow:0 0 12px #facc1544;
    transform:translateY(-2px)
}

.weapon small{
    display:block;
    color:#b8d7e8;
    margin-top:4px
}

.fire-button{
    width:calc(100% - 12px);
    font-size:19px;
    padding:15px;
    margin-top:10px
}

.bottom-turn{
    margin-top:9px;
    padding:12px;
    border-radius:12px;
    background:#12364e;
    font-size:19px;
    font-weight:bold
}

.bottom-instruction{
    color:#b8d7e8;
    font-size:14px;
    min-height:20px;
    margin-top:6px
}

/* ROOMS */

.room-list{margin-top:15px}

.room-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#12364e;
    border-radius:10px;
    padding:10px;
    margin:7px 0
}

.room-item button{
    margin:0;
    padding:8px 14px
}

.notice{
    font-size:18px;
    font-weight:bold;
    margin:10px
}

/* EFFECTS */

@keyframes hit{
    0%{transform:scale(.7)}
    70%{transform:scale(1.12)}
    100%{transform:scale(1)}
}

@keyframes selectedPulse{
    from{
        box-shadow:0 0 6px #facc15,inset 0 0 5px #fff
    }
    to{
        box-shadow:0 0 16px #facc15,inset 0 0 10px #fff
    }
}

@keyframes fireFlash{
    0%{box-shadow:0 0 0 #facc15}
    50%{box-shadow:0 0 25px #facc15}
    100%{box-shadow:0 0 0 #facc15}
}

.flash-fire{animation:fireFlash .4s}

/* MOBILE */

@media(max-width:420px){

    .screen{
        padding:15px 10px
    }

    .panel{
        padding:20px
    }

    .board{
        width:min(96vw,400px)
    }

    .weapon{
        padding:9px 5px;
        font-size:14px
    }

    .fire-button{
        font-size:18px
    }
}
</style>
</head>

<body>

<section id="startScreen" class="screen active">
<div class="panel">

<h1>⚓ معركة السفن ⚓</h1>

<div class="menu-buttons">

<button onclick="openOnlineScreen()">
🎮 لعب أونلاين
</button>

<button onclick="openFriendScreen()">
🎮 لعب مع صديق
</button>

<button onclick="openSettingsScreen()">
⚙️ الإعدادات
</button>

<button class="online-count" id="onlineCountButton">
👥 المتصلون الآن: <span id="onlineCount">0</span>
</button>

</div>
</div>
</section>

<section id="onlineScreen" class="screen">
<div class="panel">

<h2>🎮 لعب أونلاين</h2>

<div class="status" id="onlineStatus">
اضغط للبحث عن لاعب
</div>

<div class="menu-buttons">

<button class="success"
id="onlineSearchButton"
onclick="startOnlineSearch()">
🔎 البحث عن لاعب
</button>

<button class="back"
onclick="cancelOnlineSearch();backToMain()">
🏠 عودة
</button>

</div>
</div>
</section>

<section id="friendScreen" class="screen">
<div class="panel">

<h2>🎮 لعب مع صديق</h2>

<div class="menu-buttons">

<button onclick="showCreateRoom()">
🏠 إنشاء غرفة
</button>

<button onclick="showJoinRoom()">
🚪 دخول إلى غرفة
</button>

<button class="back" onclick="backToMain()">
🏠 عودة
</button>

</div>

<div id="friendStatus" class="status"></div>

</div>
</section>

<section id="createRoomScreen" class="screen">
<div class="panel">

<h2>🏠 إنشاء غرفة</h2>

<input
id="createRoomName"
placeholder="اسم الغرفة"
maxlength="30">

<div class="menu-buttons">

<button class="success" onclick="createRoom()">
إنشاء الغرفة
</button>

<button class="back" onclick="openFriendScreen()">
🏠 عودة
</button>

</div>

<div id="createStatus" class="status"></div>

</div>
</section>

<section id="joinRoomScreen" class="screen">
<div class="panel">

<h2>🚪 دخول إلى غرفة</h2>

<input
id="joinRoomId"
inputmode="numeric"
placeholder="رمز الغرفة"
maxlength="30">

<div class="menu-buttons">

<button class="success" onclick="joinRoom()">
دخول
</button>

<button class="back" onclick="openFriendScreen()">
🏠 عودة
</button>

</div>

<div id="joinStatus" class="status"></div>

<div id="roomList" class="room-list"></div>

</div>
</section>

<section id="lobbyScreen" class="screen">
<div class="panel">

<h2>🚢 غرفة اللعب</h2>

<p>رمز الغرفة:</p>

<h2 id="roomCode">---</h2>

<p id="lobbyStatus" class="status">
في انتظار اللاعب الآخر...
</p>

<div class="menu-buttons">

<button
class="success"
id="readyButton"
onclick="readyUp()">
✅ جاهز
</button>

<button
class="back"
onclick="leaveRoom()">
🚪 مغادرة الغرفة
</button>

</div>
</div>
</section>

<section id="settingsScreen" class="screen">
<div class="panel">

<h2>⚙️ الإعدادات</h2>

<label>اسم اللاعب</label>

<input
id="playerName"
maxlength="20"
placeholder="اكتب اسمك">

<div class="menu-buttons">

<button class="success" onclick="saveSettings()">
💾 حفظ
</button>

<button class="back" onclick="backToMain()">
🏠 عودة
</button>

</div>

<div id="settingsStatus" class="status"></div>

</div>
</section>

<section id="gameScreen" class="screen">

<div class="game-screen-content">

<div class="game-top">

<h1 class="game-title">
⚔️ معركة السفن ⚔️
</h1>

<div id="prepArea" class="preparation-box">

<div class="timer">
⏱️ <span id="prepTimer">20</span>
</div>

<div class="notice" id="prepStatus">
رتّب سفنك ثم أكد الترتيب
</div>

</div>

</div>

<div class="board-container">

<h2 class="map-title">🗺️ خريطة</h2>

<div id="myBoard" class="board"></div>

</div>

<div id="placementControls" class="placement-controls">

<button onclick="randomizeShips()">
🔀 ترتيب عشوائي
</button>

<button
class="success"
id="battleReadyButton"
onclick="sendReadyForBattle()">
✅ تأكيد الترتيب
</button>

</div>

<div
id="battleControls"
class="battle-controls"
style="display:none">

<div class="weapons">

<div
class="weapon selected"
id="normalWeapon"
onclick="selectWeapon('normal')">

🎯 قذيفة

<small>
خانة واحدة • ∞
</small>

</div>

<div
class="weapon"
id="bombWeapon"
onclick="selectWeapon('bomb')">

💣 قنبلة

<small>
9 خانات • <span id="bombAmmo">2</span>
</small>

</div>

</div>

<button
class="success fire-button"
id="fireButton"
onclick="fireSelectedWeapon()">
🔥 إطلاق
</button>

<div class="bottom-turn" id="bottomTurn">
⏳ ---
</div>

<div class="bottom-instruction" id="gameStatus">
---
</div>

</div>

<button class="back" onclick="leaveGame()">
🚪 خروج
</button>

</div>
</section>

<section id="resultScreen" class="screen">

<div class="panel">

<h1>🏆 النتيجة</h1>

<div id="resultText"></div>

<button onclick="backToMain()">
🏠 القائمة الرئيسية
</button>

</div>
</section>

<script>
"use strict";

const SERVER_URL =
    location.protocol==="https:"
        ? "wss://"+location.host
        : "ws://"+location.host;

let socket=null;

let currentRoom=null;
let playerId=null;
let playerName=
    localStorage.getItem("playerName")||"لاعب";

let isReady=false;
let isBattleReady=false;
let isMyTurn=false;
let gamePhase="none";

let selectedWeapon="normal";
let selectedTarget=null;

let prepTimerInterval=null;
let prepSeconds=20;

let isSearchingOnline=false;

let myGrid=createEmptyGrid();

let currentShips=[
    {size:4,cells:[]},
    {size:3,cells:[]},
    {size:3,cells:[]},
    {size:2,cells:[]},
    {size:2,cells:[]}
];

/*
   الأماكن التي هاجمها اللاعب على الخصم.
   هذه العلامات تظهر على نفس خريطة اللاعب.
*/
let attackMarks=createEmptyGrid();

let weapons={
    normal:Infinity,
    bomb:2
};

function createEmptyGrid(){
    return Array.from(
        {length:10},
        ()=>Array(10).fill("")
    );
}

function showScreen(id){

    document
        .querySelectorAll(".screen")
        .forEach(
            s=>s.classList.remove("active")
        );

    document
        .getElementById(id)
        ?.classList.add("active");
}

function setStatus(id,text){

    const e=
        document.getElementById(id);

    if(e)e.textContent=text||"";
}

function updateOnlineCount(count){

    const e=
        document.getElementById("onlineCount");

    if(e){
        e.textContent=
            Number(count)||0;
    }
}

function backToMain(){

    cancelOnlineSearch();

    if(currentRoom){

        sendMessage({
            type:"leaveRoom",
            roomId:currentRoom
        });
    }

    currentRoom=null;

    isReady=false;
    isBattleReady=false;

    stopPrepTimer();

    gamePhase="none";

    showScreen("startScreen");
}

function openOnlineScreen(){

    showScreen("onlineScreen");

    setStatus(
        "onlineStatus",
        isSearchingOnline
            ? "🔎 جاري البحث عن لاعب..."
            : "اضغط للبحث عن لاعب"
    );
}

function openFriendScreen(){

    cancelOnlineSearch();

    showScreen("friendScreen");

    setStatus("friendStatus","");
}

function openSettingsScreen(){

    document
        .getElementById("playerName")
        .value=playerName;

    setStatus("settingsStatus","");

    showScreen("settingsScreen");
}

function showCreateRoom(){

    cancelOnlineSearch();

    document
        .getElementById("createRoomName")
        .value="";

    showScreen("createRoomScreen");
}

function showJoinRoom(){

    cancelOnlineSearch();

    document
        .getElementById("joinRoomId")
        .value="";

    showScreen("joinRoomScreen");

    requestRoomList();
}

function saveSettings(){

    const name=
        document
            .getElementById("playerName")
            .value
            .trim();

    if(!name){

        setStatus(
            "settingsStatus",
            "اكتب اسم اللاعب أولاً"
        );

        return;
    }

    playerName=name;

    localStorage.setItem(
        "playerName",
        playerName
    );

    setStatus(
        "settingsStatus",
        "تم حفظ الاسم بنجاح"
    );
}

/* CONNECTION */

function connectToServer(callback){

    if(
        socket?.readyState===
        WebSocket.OPEN
    ){

        callback?.();
        return;
    }

    if(
        socket?.readyState===
        WebSocket.CONNECTING
    ){

        const timer=setInterval(()=>{

            if(
                socket?.readyState===
                WebSocket.OPEN
            ){

                clearInterval(timer);
                callback?.();
            }

            if(
                !socket||
                socket.readyState===
                WebSocket.CLOSED
            ){

                clearInterval(timer);
            }

        },100);

        return;
    }

    try{

        socket=
            new WebSocket(SERVER_URL);

    }catch(e){

        showConnectionError();
        return;
    }

    socket.onopen=()=>{

        sendMessage({
            type:"connect",
            name:playerName,
            playerName
        });

        callback?.();
    };

    socket.onmessage=e=>{
        handleServerMessage(e.data);
    };

    socket.onerror=()=>{
        showConnectionError();
    };

    socket.onclose=()=>{

        socket=null;
        isSearchingOnline=false;
    };
}

function ensureConnection(callback){

    if(
        socket?.readyState===
        WebSocket.OPEN
    ){

        callback();

    }else{

        connectToServer(callback);
    }
}

function sendMessage(data){

    if(
        !socket||
        socket.readyState!==WebSocket.OPEN
    ){

        return false;
    }

    try{

        socket.send(
            JSON.stringify(data)
        );

        return true;

    }catch(e){

        return false;
    }
}

function showConnectionError(){

    [
        "onlineStatus",
        "friendStatus",
        "createStatus",
        "joinStatus",
        "lobbyStatus",
        "gameStatus"
    ].forEach(
        id=>setStatus(
            id,
            "❌ تعذر الاتصال بالسيرفر"
        )
    );
}

/* ONLINE */

function startOnlineSearch(){

    if(isSearchingOnline)return;

    isSearchingOnline=true;

    const button=
        document.getElementById(
            "onlineSearchButton"
        );

    button.disabled=true;
    button.textContent=
        "🔎 جاري البحث...";

    setStatus(
        "onlineStatus",
        "🔎 جاري البحث عن لاعب متصل..."
    );

    ensureConnection(()=>{

        sendMessage({
            type:"findMatch",
            playerName,
            name:playerName
        });
    });
}

function cancelOnlineSearch(){

    if(isSearchingOnline){

        sendMessage({
            type:"cancelMatch"
        });
    }

    isSearchingOnline=false;

    const button=
        document.getElementById(
            "onlineSearchButton"
        );

    if(button){

        button.disabled=false;
        button.textContent=
            "🔎 البحث عن لاعب";
    }
}

/* ROOMS */

function createRoom(){

    const roomName=
        document
            .getElementById("createRoomName")
            .value
            .trim();

function readyUp(){

    });

        "lobbyStatus",

function resetReadyButton(){

        document.getElementById(
            "readyButton"
        );

    if(button){

        button.disabled=false;
        button.textContent="✅ جاهز";

function leaveRoom(){

        sendMessage({
            type:"leaveRoom",
            roomId:currentRoom
        });

function leaveGame(){
    leaveRoom();
}

/* SERVER */

function handleServerMessage(raw){

    let data;

    try{

        data=
            typeof raw==="string"
                ? JSON.parse(raw)
                : raw;

    }catch(e){

        return;
    }

    if(!data?.type)return;

    switch(data.type){

        case "connected":

            playerId=
                data.playerId||
                data.id||
                playerId;

            if(
                data.onlineCount!==undefined
            ){

                updateOnlineCount(
                    data.onlineCount
                );
            }

            break;

        case "onlineCount":

            updateOnlineCount(
                data.count
            );

            break;

        case "searching":

            setStatus(
                "onlineStatus",
                "🔎 جاري البحث عن لاعب..."
            );

            break;

        case "matchFound":

            isSearchingOnline=false;

            currentRoom=
                data.roomId||null;

            document
                .getElementById("roomCode")
                .textContent=
                currentRoom||"---";

            isReady=false;

            resetReadyButton();

            showScreen("lobbyScreen");

            setStatus(
                "lobbyStatus",
                "🎉 تم العثور على الخصم، اضغط جاهز"
            );

            break;

        case "roomCreated":
        case "roomJoined":

            currentRoom=
                data.roomId||
                data.roomCode||
                null;

            isReady=false;

            resetReadyButton();

            document
                .getElementById("roomCode")
                .textContent=
                currentRoom||"---";

            showScreen("lobbyScreen");

            setStatus(
                "lobbyStatus",
                data.type==="roomCreated"
                    ? "🏠 تم إنشاء الغرفة، أرسل الرمز للخصم"
                    : "✅ دخلت إلى الغرفة، اضغط جاهز"
            );

            break;

        case "roomInfo":

            currentRoom=
                data.roomId||
                currentRoom;

            if(currentRoom){

                document
                    .getElementById("roomCode")
                    .textContent=
                    currentRoom;
            }

            break;

        case "playerJoined":

            setStatus(
                "lobbyStatus",
                "👤 دخل اللاعب الآخر إلى الغرفة، اضغط جاهز"
            );

            break;

        case "playerReady":

            setStatus(
                "lobbyStatus",
                data.playerId===playerId
                    ? "✅ أنت جاهز، في انتظار الخصم..."
                    : "👤 اللاعب الآخر جاهز، اضغط جاهز للبدء"
            );

            break;

        case "startGame":

            startPreparation(data);

            break;

        case "preparationTimer":

            startPrepTimer(
                Number(data.seconds)||0
            );

            break;

        case "playerBattleReady":

            if(
                data.playerId===playerId
            ){

                setStatus(
                    "prepStatus",
                    "✅ تم تأكيد ترتيبك، في انتظار الخصم..."
                );

            }else{

                setStatus(
                    "prepStatus",
                    "👤 الخصم أكد ترتيبه"
                );
            }

            break;

        case "battleStarted":

            startBattle(data);

            break;

        case "turnChanged":

            isMyTurn=
                data.currentPlayerId===
                playerId;

            updateTurnUI();
            renderBoard();

            break;

        case "attackResult":

            applyAttackResult(data);

            break;

        case "gameOver":

            stopPrepTimer();

            playSound(
                data.winnerId===playerId
                    ? "win"
                    : "lose"
            );

            document
                .getElementById("resultText")
                .innerHTML=
                    data.winnerId===playerId
                        ? "<h2>🎉 فزت!</h2><p>🏆 دمرت أسطول الخصم بالكامل</p>"
                        : "<h2>💀 خسرت!</h2><p>تم تدمير أسطولك</p>";

            showScreen("resultScreen");

            break;

        case "roomList":

            renderRooms(
                data.rooms||[]
            );

            break;

        case "opponentLeft":

            alert(
                data.message||
                "غادر اللاعب الآخر الغرفة"
            );

            leaveRoom();

            break;

        case "error":

            showErrorMessage(
                data.message||
                "حدث خطأ"
            );

            break;
    }
}

function showErrorMessage(message){

    [
        "onlineStatus",
        "friendStatus",
        "createStatus",
        "joinStatus",
        "lobbyStatus"
    ].forEach(
        id=>setStatus(id,message)
    );

    /*
       أثناء اللعب لا نريد رسائل إضافية.
    */
    if(gamePhase!=="battle"){
        setStatus("gameStatus",message);
    }
}

function renderRooms(rooms){

    const list=
        document.getElementById("roomList");

    list.innerHTML="";

    if(!rooms.length){

        list.textContent=
            "لا توجد غرف متاحة";

        return;
    }

    rooms.forEach(room=>{

        const item=
            document.createElement("div");

        item.className="room-item";

        const name=
            document.createElement("span");

        name.textContent=
            (room.roomName||"غرفة")+
            " #"+
            room.roomId;

        const button=
            document.createElement("button");

        button.textContent="دخول";
        button.className="success";

        button.onclick=()=>{

            document
                .getElementById("joinRoomId")
                .value=
                room.roomId;

            joinRoom();
        };

        item.append(name,button);
        list.appendChild(item);
    });
}

/* PREPARATION */

function startPreparation(data){

    currentRoom=
        data.roomId||
        currentRoom;

    gamePhase="preparation";
    isBattleReady=false;
    selectedTarget=null;

    attackMarks=createEmptyGrid();

    myGrid=
        Array.isArray(data.grid)
            ? data.grid
            : createEmptyGrid();

    currentShips=
        Array.isArray(data.ships)
            ? data.ships.map(s=>({
                size:Number(s.size),
                cells:Array.isArray(s.cells)
                    ? s.cells.map(c=>[
                        Number(c[0]),
                        Number(c[1])
                    ])
                    : []
            }))
            : [
                {size:4,cells:[]},
                {size:3,cells:[]},
                {size:3,cells:[]},
                {size:2,cells:[]},
                {size:2,cells:[]}
            ];

    document
        .getElementById("prepArea")
        .style.display="block";

    document
        .getElementById("placementControls")
        .style.display="block";

    document
        .getElementById("battleControls")
        .style.display="none";

    document
        .getElementById("prepStatus")
        .textContent=
        "رتّب سفنك ثم أكد الترتيب";

    const button=
        document.getElementById(
            "battleReadyButton"
        );

    button.disabled=false;
    button.textContent=
        "✅ تأكيد الترتيب";

    renderBoard();

    showScreen("gameScreen");

    startPrepTimer(
        Number(data.seconds)||20
    );
}

function startPrepTimer(seconds){

    clearInterval(prepTimerInterval);

    prepSeconds=
        Math.max(0,seconds);

    document
        .getElementById("prepTimer")
        .textContent=
        prepSeconds;

    prepTimerInterval=
        setInterval(()=>{

            prepSeconds--;

            document
                .getElementById("prepTimer")
                .textContent=
                Math.max(0,prepSeconds);

            if(prepSeconds<=0){

                stopPrepTimer();
            }

        },1000);
}

function stopPrepTimer(){

    clearInterval(
        prepTimerInterval
    );

    prepTimerInterval=null;
}

/* RANDOM SHIPS */

function randomizeShips(sendUpdate=true){

    myGrid=createEmptyGrid();

    currentShips=[
        {size:4,cells:[]},
        {size:3,cells:[]},
        {size:3,cells:[]},
        {size:2,cells:[]},
        {size:2,cells:[]}
    ];

    currentShips.forEach(ship=>{

        let placed=false;

        for(
            let tries=0;
            tries<2000&&!placed;
            tries++
        ){

            const horizontal=
                Math.random()>.5;

            const row=
                Math.floor(Math.random()*10);

            const col=
                Math.floor(Math.random()*10);

            const cells=[];

            for(
                let i=0;
                i<ship.size;
                i++
            ){

                const r=
                    horizontal
                        ? row
                        : row+i;

                const c=
                    horizontal
                        ? col+i
                        : col;

                if(
                    r>=10||
                    c>=10||
                    myGrid[r][c]!==""
                ){

                    cells.length=0;
                    break;
                }

                cells.push([r,c]);
            }

            if(cells.length===ship.size){

                cells.forEach(([r,c])=>{
                    myGrid[r][c]="ship";
                });

                ship.cells=cells;
                placed=true;
            }
        }
    });

    renderBoard();
    playSound("select");

    if(sendUpdate){
        sendBattleGridUpdate();
    }
}

function hasValidLocalFleet(){

    return currentShips.every(
        s=>s.cells.length===s.size
    ) &&
    currentShips.reduce(
        (n,s)=>n+s.cells.length,
        0
    )===14;
}

function sendBattleGridUpdate(){

    if(
        gamePhase!=="preparation"||
        !currentRoom
    ){
        return;
    }

    sendMessage({

        type:"battleGridUpdate",

        roomId:currentRoom,

        grid:myGrid,

        ships:
            currentShips.map(s=>({
                size:s.size,
                cells:s.cells
            }))
    });
}

function sendReadyForBattle(){

    if(
        !currentRoom||
        gamePhase!=="preparation"
    ){
        return;
    }

    if(isBattleReady)return;

    if(!hasValidLocalFleet()){

        setStatus(
            "prepStatus",
            "❌ ترتيب السفن غير صحيح"
        );

        return;
    }

    isBattleReady=true;

    const button=
        document.getElementById(
            "battleReadyButton"
        );

    button.disabled=true;
    button.textContent=
        "⏳ تم التأكيد";

    playSound("confirm");

    sendMessage({

        type:"battleReady",

        roomId:currentRoom,

        grid:myGrid,

        ships:
            currentShips.map(s=>({
                size:s.size,
                cells:s.cells
            }))
    });

    setStatus(
        "prepStatus",
        "✅ تم تأكيد ترتيبك، في انتظار الخصم..."
    );
}

/* BATTLE */

function startBattle(data){

    stopPrepTimer();

    gamePhase="battle";
    isBattleReady=true;

    selectedTarget=null;

    attackMarks=createEmptyGrid();

    isMyTurn=
        data.currentPlayerId===playerId;

    weapons={
        normal:Infinity,
        bomb:2
    };

    document
        .getElementById("prepArea")
        .style.display="none";

    document
        .getElementById("placementControls")
        .style.display="none";

    document
        .getElementById("battleControls")
        .style.display="block";

    document
        .getElementById("bombAmmo")
        .textContent="2";

    selectWeapon("normal",false);

    updateTurnUI();
    renderBoard();

    playSound("battleStart");
}

function updateTurnUI(){

    const turn=
        document.getElementById("bottomTurn");

    if(!turn)return;

    if(isMyTurn){

        turn.textContent=
            "🎯 الدور: دورك";

        turn.style.color="#86efac";

    }else{

    }

        "gameStatus",

            ? selectedWeapon==="bomb"
                ? "💣 اختر مركز القنبلة ثم اضغط إطلاق"
                : "🎯 اختر خانة ثم اضغط إطلاق"

    );

/* WEAPONS */

function selectWeapon(
    weapon,
    playEffect=true
){

    if(gamePhase!=="battle")return;

    if(
        weapon==="bomb"&&
        weapons.bomb<=0
    ){

        setStatus(
            "gameStatus",
            "❌ لا توجد قنابل متبقية"
        );

        return;
    }

    selectedWeapon=weapon;

    document
        .getElementById("normalWeapon")
        .classList.toggle(
            "selected",
            weapon==="normal"
        );

    document
        .getElementById("bombWeapon")
        .classList.toggle(
            "selected",
            weapon==="bomb"
        );

    if(playEffect){

        playSound("weapon");
    }

    if(isMyTurn){

        setStatus(
            "gameStatus",
            weapon==="normal"
                ? "🎯 القذيفة: اختر خانة ثم اضغط إطلاق"
                : "💣 القنبلة: اختر مركز منطقة 3×3"
        );
    }
}

/* TARGET */

function fireSelectedWeapon(){

    if(
        gamePhase!=="battle"||
        !isMyTurn
    ){

        return;
    }

    if(selectedTarget===null){

        return;
    }

    if(
        selectedWeapon==="bomb"&&
        weapons.bomb<=0
    ){

        return;
    }

    playSound("fire");

    const board=
        document.getElementById("myBoard");

    board.classList.remove("flash-fire");

    void board.offsetWidth;

    board.classList.add("flash-fire");

    sendMessage({

        type:"attack",

        roomId:currentRoom,

        weapon:selectedWeapon,

        row:selectedTarget.row,

        col:selectedTarget.col
    });

    selectedTarget=null;

    renderBoard();
}

function selectTarget(row,col){

    if(
        gamePhase!=="battle"||
        !isMyTurn
    ){

        return;
    }

    /*
       لا يوجد منع للخانة السابقة.
       يمكن اختيارها وإطلاق النار عليها مرة أخرى.
    */

    selectedTarget={
        row,
        col
    };

    playSound("select");

    renderBoard();
}

/* SHIPS */

function getShipForCell(row,col){

    return currentShips.findIndex(
        ship=>
            ship.cells.some(
                c=>
                    Number(c[0])===row&&
                    Number(c[1])===col
            )
    );
}

function getShipOrientation(ship){

    if(
        !ship||
        ship.cells.length<2
    ){

        return "vertical";
    }

    return Number(ship.cells[0][0])===
           Number(ship.cells[1][0])
        ? "horizontal"
        : "vertical";
}

/* BOARD */

function isBombPreviewCell(
    row,
    col
){

    if(
        !selectedTarget||
        selectedWeapon!=="bomb"
    ){

        return false;
    }

    return (
        Math.abs(
            row-selectedTarget.row
        )<=1 &&
        Math.abs(
            col-selectedTarget.col
        )<=1
    );
}

function renderBoard(){

    const board=
        document.getElementById(
            "myBoard"
        );

    if(!board)return;

    board.innerHTML="";

    for(let row=0;row<10;row++){

        for(let col=0;col<10;col++){

            const cell=
                document.createElement("div");

            cell.className="cell";

            const shipIndex=
                getShipForCell(
                    row,
                    col
                );

            /*
               السفينة تبقى ظاهرة حتى إذا
               أصيبت.
            */
            if(shipIndex>=0){

                cell.classList.add("ship");

                const ship=
                    currentShips[shipIndex];

                cell.classList.add(
                    "ship"+ship.size
                );

                cell.classList.add(
                    getShipOrientation(ship)
                );
            }

            /*
               إصابات الخصم على سفني.
            */
            if(
                myGrid[row][col]==="hit"
            ){

                cell.classList.add("hit");

            }else if(
                myGrid[row][col]==="miss"
            ){

                cell.classList.add("miss");
            }

            /*
               أماكن هجماتي على الخصم.
               تظهر في نفس الخريطة.
            */
            if(
                attackMarks[row][col]==="hit"
            ){

                cell.classList.add(
                    "target-hit"
                );

            }else if(
                attackMarks[row][col]==="miss"
            ){

                cell.classList.add(
                    "target-miss"
                );
            }

            /*
               تحديد الخانة الحالية.
            */
            if(
                selectedTarget&&
                selectedTarget.row===row&&
                selectedTarget.col===col
            ){

                cell.classList.add(
                    "selected-target"
                );
            }

            /*
               معاينة القنبلة 3×3.
            */
            if(
                isBombPreviewCell(row,col)
            ){

                cell.classList.add(
                    "bomb-preview"
                );
            }

            if(
                gamePhase==="battle"&&
                isMyTurn
            ){

                cell.classList.add(
                    "attackable"
                );

                cell.onclick=()=>{
                    selectTarget(
                        row,
                        col
                    );
                };
            }

            board.appendChild(cell);
        }
    }
}

/* ATTACK RESULT */

function applyAttackResult(data){

    if(
        data.attackerId===playerId
    ){

        /*
           سجل هجوم اللاعب على نفس الخريطة.
        */
        if(
            Array.isArray(data.cells)
        ){

            data.cells.forEach(c=>{

                const r=Number(c.row);
                const col=Number(c.col);

                if(
                    r>=0&&
                    r<10&&
                    col>=0&&
                    col<10
                ){

                    attackMarks[r][col]=
                        c.hit
                            ? "hit"
                            : "miss";
                }
            });
        }

        if(
            data.weapon==="bomb"
        ){

            weapons.bomb=
                Math.max(
                    0,
                    weapons.bomb-1
                );

            document
                .getElementById("bombAmmo")
                .textContent=
                weapons.bomb;
        }

    }else{

        /*
           هجوم الخصم على خريطة اللاعب.
        */
        if(
            Array.isArray(data.cells)
        ){

            data.cells.forEach(c=>{

                const r=Number(c.row);
                const col=Number(c.col);

                if(
                    r>=0&&
                    r<10&&
                    col>=0&&
                    col<10
                ){

                    myGrid[r][col]=
                        c.hit
                            ? "hit"
                            : "miss";
                }
            });
        }
    }

    /*
       الدور ينتقل دائمًا بعد كل هجوم.
    */
    isMyTurn=
        data.nextPlayerId===playerId;

    if(data.sunk){

        setStatus(
            "gameStatus",
            "🚢 تم إغراق سفينة!"
        );

        playSound("sink");

    }else if(data.hit){

        setStatus(
            "gameStatus",
            "💥 إصابة!"
        );

        playSound("hit");

    }else{

        setStatus(
            "gameStatus",
            "💨 لا توجد إصابة"
        );

        playSound("miss");
    }

    updateTurnOnly();
    renderBoard();
}

function updateTurnOnly(){

    const turn=
        document.getElementById(
            "bottomTurn"
        );

    if(!turn)return;

    if(isMyTurn){

        turn.textContent=
            "🎯 الدور: دورك";

        turn.style.color="#86efac";

    }else{

        turn.textContent=
            "⏳ الدور: عند الخصم";

        turn.style.color="#facc15";
    }
}

/* SOUND */

let audioContext=null;

function getAudioContext(){

    const AudioContext=
        window.AudioContext||
        window.webkitAudioContext;

    if(!AudioContext)return null;

    if(!audioContext){

        audioContext=
            new AudioContext();
    }

    if(
        audioContext.state==="suspended"
    ){

        audioContext.resume();
    }

    return audioContext;
}

function playSound(type){

    try{

        const ctx=
            getAudioContext();

        if(!ctx)return;

        const now=
            ctx.currentTime;

        const osc=
            ctx.createOscillator();

        const gain=
            ctx.createGain();

        osc.connect(gain);
        gain.connect(ctx.destination);

        let startFreq=300;
        let endFreq=180;
        let duration=.12;
        let volume=.045;

        switch(type){

            case "select":
                startFreq=520;
                endFreq=650;
                duration=.08;
                volume=.035;
                break;

            case "weapon":
                startFreq=280;
                endFreq=520;
                duration=.11;
                volume=.045;
                break;

            case "confirm":
                startFreq=420;
                endFreq=680;
                duration=.16;
                volume=.045;
                break;

            case "fire":
                startFreq=150;
                endFreq=55;
                duration=.28;
                volume=.07;
                break;

            case "hit":
                startFreq=230;
                endFreq=80;
                duration=.25;
                volume=.065;
                break;

            case "miss":
                startFreq=320;
                endFreq=170;
                duration=.18;
                volume=.035;
                break;

            case "sink":
                startFreq=180;
                endFreq=45;
                duration=.55;
                volume=.07;
                break;

            case "battleStart":
                startFreq=380;
                endFreq=700;
                duration=.25;
                volume=.045;
                break;

            case "win":
                startFreq=500;
                endFreq=900;
                duration=.55;
                volume=.06;
                break;

            case "lose":
                startFreq=220;
                endFreq=70;
                duration=.55;
                volume=.055;
                break;
        }

        osc.type=
            type==="fire"||
            type==="sink"
                ? "sawtooth"
                : "sine";

        osc.frequency.setValueAtTime(
            startFreq,
            now
        );

        osc.frequency.exponentialRampToValueAtTime(
            Math.max(30,endFreq),
            now+duration
        );

        gain.gain.setValueAtTime(
            .001,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            volume,
            now+.015
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            now+duration
        );

        osc.start(now);
        osc.stop(now+duration+.02);

    }catch(e){}
}

ensureConnection();

</script>
