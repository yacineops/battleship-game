<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>معركة السفن</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #07131d;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

button,
input {
    font: inherit;
}

button {
    border: none;
    border-radius: 12px;
    padding: 13px 20px;
    margin: 6px;
    color: white;
    background: #1266a8;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #1684d4;
}

button:active {
    transform: scale(.96);
}

button.back {
    background: #6b2935;
}

button.success {
    background: #16834a;
}

.screen {
    display: none;
    min-height: 100vh;
    padding: 25px 15px;
    align-items: center;
    justify-content: center;
    flex-direction: column;
}

.screen.active {
    display: flex;
}

.panel {
    width: 100%;
    max-width: 430px;
    padding: 25px;
    border-radius: 20px;
    background: #0d2233;
    box-shadow: 0 0 25px #0008;
}

h1 {
    color: #38bdf8;
}

h2 {
    color: #7dd3fc;
}

.menu-buttons {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.menu-buttons button {
    width: 100%;
    margin: 0;
}

input {
    width: 100%;
    padding: 13px;
    margin: 8px 0;
    border: 1px solid #28516d;
    border-radius: 10px;
    background: #07131d;
    color: white;
    text-align: center;
    outline: none;
}

.status {
    min-height: 25px;
    margin: 12px 0;
    color: #facc15;
}

.boards {
    width: 100%;
    max-width: 900px;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 25px;
}

.board-container {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.board {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    width: min(90vw, 360px);
    aspect-ratio: 1;
    border: 2px solid #2384bd;
    background: #0a2b43;
}

.cell {
    border: 1px solid #174b68;
    background: #0b344f;
    cursor: pointer;
    position: relative;
}

.cell.ship {
    background: #64748b;
}

.cell.hit {
    background: #b91c1c;
}

.cell.miss {
    background: #d1d5db;
}

.cell.hit::after {
    content: "✕";
    color: white;
    font-size: 20px;
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
}

.cell.miss::after {
    content: "•";
    color: #111827;
    font-size: 24px;
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
}

.room-list {
    margin-top: 15px;
}

.room-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #12364e;
    border-radius: 10px;
    padding: 10px;
    margin: 7px 0;
}

.room-item button {
    margin: 0;
    padding: 8px 14px;
}
</style>
</head>

<body>

<section id="startScreen" class="screen active">
    <div class="panel">
        <h1>⚓ معركة السفن ⚓</h1>

        <div class="menu-buttons">
            <button type="button" onclick="openOnlineScreen()">🎮 لعب أونلاين</button>
            <button type="button" onclick="openFriendScreen()">🎮 لعب مع صديق</button>
            <button type="button" onclick="openSettingsScreen()">⚙️ الإعدادات</button>
        </div>
    </div>
</section>

<section id="onlineScreen" class="screen">
    <div class="panel">
        <h2>🎮 لعب أونلاين</h2>

        <div class="menu-buttons">
            <button type="button" onclick="connectToServer()">🔗 اتصال</button>
            <button type="button" class="back" onclick="backToMain()">🏠 عودة</button>
        </div>

        <div id="onlineStatus" class="status"></div>
    </div>
</section>

<section id="friendScreen" class="screen">
    <div class="panel">
        <h2>🎮 لعب مع صديق</h2>

        <div class="menu-buttons">
            <button type="button" onclick="showCreateRoom()">🏠 إنشاء غرفة</button>
            <button type="button" onclick="showJoinRoom()">🚪 دخول إلى غرفة</button>
            <button type="button" class="back" onclick="backToMain()">🏠 عودة</button>
        </div>

        <div id="friendStatus" class="status"></div>
    </div>
</section>

<section id="createRoomScreen" class="screen">
    <div class="panel">
        <h2>🏠 إنشاء غرفة</h2>

        <input
            id="createRoomName"
            type="text"
            placeholder="اسم الغرفة"
            maxlength="30"
        >

        <div class="menu-buttons">
            <button type="button" class="success" onclick="createRoom()">
                إنشاء الغرفة
            </button>

            <button type="button" class="back" onclick="openFriendScreen()">
                🏠 عودة
            </button>
        </div>

        <div id="createStatus" class="status"></div>
    </div>
</section>

<section id="joinRoomScreen" class="screen">
    <div class="panel">
        <h2>🚪 دخول إلى غرفة</h2>

        <input
            id="joinRoomId"
            type="text"
            placeholder="رمز الغرفة"
            maxlength="30"
        >

        <div class="menu-buttons">
            <button type="button" class="success" onclick="joinRoom()">
                دخول
            </button>

            <button type="button" class="back" onclick="openFriendScreen()">
                🏠 عودة
            </button>
        </div>

        <div id="joinStatus" class="status"></div>
        <div id="roomList" class="room-list"></div>
    </div>
</section>

<section id="lobbyScreen" class="screen">
    <div class="panel">
        <h2>🚢 غرفة اللعب</h2>

        <p>رمز الغرفة:</p>
        <h2 id="roomCode">---</h2>

        <p id="lobbyStatus" class="status">
            في انتظار اللاعب الآخر...
        </p>

        <div class="menu-buttons">
            <button type="button" class="success" onclick="readyUp()">
                ✅ جاهز
            </button>

            <button type="button" class="back" onclick="leaveRoom()">
                🚪 مغادرة الغرفة
            </button>
        </div>
    </div>
</section>

<section id="settingsScreen" class="screen">
    <div class="panel">
        <h2>⚙️ الإعدادات</h2>

        <label for="playerName">اسم اللاعب</label>

        <input
            id="playerName"
            type="text"
            maxlength="20"
            placeholder="اكتب اسمك"
        >

        <div class="menu-buttons">
            <button type="button" class="success" onclick="saveSettings()">
                💾 حفظ
            </button>

            <button type="button" class="back" onclick="backToMain()">
                🏠 عودة
            </button>
        </div>

        <div id="settingsStatus" class="status"></div>
    </div>
</section>

<section id="gameScreen" class="screen">
    <h1>⚔️ المعركة بدأت ⚔️</h1>

    <p>👤 <span id="myName">أنت</span></p>
    <p>🎯 الدور: <span id="turnText">---</span></p>

    <div class="boards">
        <div class="board-container">
            <h2>سفينتي</h2>
            <div id="myBoard" class="board"></div>
        </div>

        <div class="board-container">
            <h2>سفن الخصم</h2>
            <div id="enemyBoard" class="board"></div>
        </div>
    </div>

    <div>
        <button type="button" onclick="randomizeShips()">
            🔀 ترتيب عشوائي
        </button>

        <button type="button" class="success" onclick="sendReadyForBattle()">
            ⚔️ بدء المعركة
        </button>

        <button type="button" class="back" onclick="leaveGame()">
            🚪 خروج
        </button>
    </div>

    <div id="gameStatus" class="status"></div>
</section>

<section id="resultScreen" class="screen">
    <div class="panel">
        <h1>🏆 النتيجة</h1>

        <div id="resultText"></div>

        <button type="button" onclick="backToMain()">
            🏠 القائمة الرئيسية
        </button>
    </div>
</section>

<script>
"use strict";

/*
    يعمل تلقائيًا على Render:
    HTTPS  -> WSS
    HTTP   -> WS
*/
const SERVER_URL =
    location.protocol === "https:"
        ? "wss://" + location.host
        : "ws://" + location.host;

let socket = null;
let currentRoom = null;
let playerId = null;
let playerName = localStorage.getItem("playerName") || "لاعب";
let isReady = false;
let isMyTurn = false;

let myGrid = createEmptyGrid();
let enemyGrid = createEmptyGrid();

const ships = [
    { size: 4, cells: [] },
    { size: 3, cells: [] },
    { size: 3, cells: [] },
    { size: 2, cells: [] },
    { size: 2, cells: [] }
];

function createEmptyGrid() {
    return Array.from(
        { length: 10 },
        () => Array(10).fill("")
    );
}

function showScreen(id) {
    document.querySelectorAll(".screen").forEach(screen => {
        screen.classList.remove("active");
    });

    const screen = document.getElementById(id);

    if (screen) {
        screen.classList.add("active");
    }
}

function backToMain() {
    showScreen("startScreen");
}

function openOnlineScreen() {
    showScreen("onlineScreen");
    setStatus("onlineStatus", "");
}

function openFriendScreen() {
    showScreen("friendScreen");
    setStatus("friendStatus", "");
}

function openSettingsScreen() {
    const input = document.getElementById("playerName");

    if (input) {
        input.value = playerName;
    }

    setStatus("settingsStatus", "");
    showScreen("settingsScreen");
}

function showCreateRoom() {
    document.getElementById("createRoomName").value = "";
    setStatus("createStatus", "");
    showScreen("createRoomScreen");
}

function showJoinRoom() {
    document.getElementById("joinRoomId").value = "";
    setStatus("joinStatus", "");
    showScreen("joinRoomScreen");
}

function setStatus(id, text) {
    const element = document.getElementById(id);

    if (element) {
        element.textContent = text || "";
    }
}

function saveSettings() {
    const input = document.getElementById("playerName");
    const name = input.value.trim();

    if (!name) {
        setStatus("settingsStatus", "اكتب اسم اللاعب أولاً");
        return;
    }

    playerName = name;
    localStorage.setItem("playerName", playerName);

    setStatus("settingsStatus", "تم حفظ الاسم بنجاح");
}

function connectToServer() {
    if (socket && socket.readyState === WebSocket.OPEN) {
        setStatus("onlineStatus", "أنت متصل بالفعل");
        return;
    }

    if (socket && socket.readyState === WebSocket.CONNECTING) {
        setStatus("onlineStatus", "جاري الاتصال بالفعل...");
        return;
    }

    setStatus("onlineStatus", "جاري الاتصال بالسيرفر...");

    try {
        socket = new WebSocket(SERVER_URL);
    } catch (error) {
        setStatus("onlineStatus", "تعذر إنشاء الاتصال بالسيرفر");
        socket = null;
        return;
    }

    socket.onopen = function() {
        setStatus("onlineStatus", "تم الاتصال بالسيرفر بنجاح");

        sendMessage({
            type: "connect",
            name: playerName,
            playerName: playerName
        });
    };

    socket.onmessage = function(event) {
        handleServerMessage(event.data);
    };

    socket.onerror = function() {
        setStatus("onlineStatus", "حدث خطأ أثناء الاتصال");
        setStatus("friendStatus", "حدث خطأ أثناء الاتصال بالسيرفر");
    };

    socket.onclose = function() {
        socket = null;
        setStatus("onlineStatus", "تم قطع الاتصال بالسيرفر");
    };
}

function ensureConnection() {
    if (socket && socket.readyState === WebSocket.OPEN) {
        return true;
    }

    connectToServer();
    setStatus("friendStatus", "جاري الاتصال بالسيرفر، حاول مرة أخرى بعد الاتصال");
    return false;
}

function sendMessage(data) {
    if (!socket || socket.readyState !== WebSocket.OPEN) {
        setStatus("friendStatus", "اتصل بالسيرفر أولاً");
        setStatus("createStatus", "اتصل بالسيرفر أولاً");
        setStatus("joinStatus", "اتصل بالسيرفر أولاً");
        return false;
    }

    try {
        socket.send(JSON.stringify(data));
        return true;
    } catch (error) {
        setStatus("friendStatus", "تعذر إرسال الطلب");
        return false;
    }
}

function createRoom() {
    const roomName =
        document.getElementById("createRoomName").value.trim();

    if (!roomName) {
        setStatus("createStatus", "اكتب اسم الغرفة");
        return;
    }

    if (!ensureConnection()) {
        return;
    }

    sendMessage({
        type: "createRoom",
        roomName: roomName,
        playerName: playerName,
        name: playerName
    });
}

function joinRoom() {
    const roomId =
        document.getElementById("joinRoomId").value.trim();

    if (!roomId) {
        setStatus("joinStatus", "اكتب رمز الغرفة");
        return;
    }

    if (!ensureConnection()) {
        return;
    }

    sendMessage({
        type: "joinRoom",
        roomId: roomId,
        playerName: playerName,
        name: playerName
    });
}

function readyUp() {
    if (!currentRoom) {
        setStatus("lobbyStatus", "لا توجد غرفة متصلة بها");
        return;
    }

    isReady = true;

    sendMessage({
        type: "ready",
        roomId: currentRoom
    });

    setStatus(
        "lobbyStatus",
        "تم التجهيز، في انتظار اللاعب الآخر..."
    );
}

function leaveRoom() {
    if (currentRoom) {
        sendMessage({
            type: "leaveRoom",
            roomId: currentRoom
        });
    }

    currentRoom = null;
    isReady = false;
    openFriendScreen();
}

function sendReadyForBattle() {
    if (!currentRoom) {
        setStatus("gameStatus", "لا توجد غرفة");
        return;
    }

    sendMessage({
        type: "battleReady",
        roomId: currentRoom,
        grid: myGrid
    });

    setStatus("gameStatus", "تم إرسال ترتيب سفنك");
}

function leaveGame() {
    leaveRoom();
}

function handleServerMessage(rawMessage) {
    let data;

    try {
        data = typeof rawMessage === "string"
            ? JSON.parse(rawMessage)
            : rawMessage;
    } catch (error) {
        return;
    }

    if (!data || !data.type) {
        return;
    }

    switch (data.type) {
        case "connected":
            playerId = data.playerId || data.id || null;
            break;

        case "roomCreated":
        case "roomJoined":
            currentRoom =
                data.roomId ||
                data.roomCode ||
                data.id ||
                null;

            document.getElementById("roomCode").textContent =
                currentRoom || "---";

            showScreen("lobbyScreen");
            break;

        case "roomInfo":
            currentRoom =
                data.roomId ||
                data.roomCode ||
                currentRoom;

            if (currentRoom) {
                document.getElementById("roomCode").textContent =
                    currentRoom;
            }

            break;

        case "playerJoined":
            setStatus(
                "lobbyStatus",
                "دخل اللاعب الآخر إلى الغرفة"
            );
            break;

        case "playerReady":
        case "playerBattleReady":
            setStatus(
                "lobbyStatus",
                "اللاعب الآخر جاهز"
            );
            break;

        case "startGame":
            startGame(data);
            break;

        case "turn":
        case "turnChanged": {
            const turnPlayerId =
                data.playerId ||
                data.currentPlayerId ||
                data.nextPlayerId ||
                null;

            isMyTurn = turnPlayerId === playerId;

            document.getElementById("turnText").textContent =
                isMyTurn ? "دورك" : "دور الخصم";

            break;
        }

        case "attackResult":
            applyAttackResult(data);
            break;

        case "gameOver":
            document.getElementById("resultText").textContent =
                data.winner === playerId
                    ? "🎉 فزت!"
                    : "💀 خسرت!";

            showScreen("resultScreen");
            break;

        case "roomList":
            renderRooms(data.rooms || []);
            break;

        case "error":
            showErrorMessage(data.message || "حدث خطأ");
            break;

        default:
            break;
    }
}

function showErrorMessage(message) {
    setStatus("onlineStatus", message);
    setStatus("friendStatus", message);
    setStatus("createStatus", message);
    setStatus("joinStatus", message);
    setStatus("lobbyStatus", message);
    setStatus("gameStatus", message);
}

function renderRooms(rooms) {
    const list = document.getElementById("roomList");
    list.innerHTML = "";

    if (!rooms.length) {
        list.textContent = "لا توجد غرف متاحة";
        return;
    }

    rooms.forEach(room => {
        const item = document.createElement("div");
        item.className = "room-item";

        const name = document.createElement("span");
        name.textContent =
            room.name ||
            room.roomName ||
            room.id ||
            room.roomId ||
            "غرفة";

        const button = document.createElement("button");
        button.type = "button";
        button.textContent = "دخول";
        button.className = "success";

        button.addEventListener("click", function() {
            document.getElementById("joinRoomId").value =
                room.id || room.roomId || "";

            joinRoom();
        });

        item.appendChild(name);
        item.appendChild(button);
        list.appendChild(item);
    });
}

function startGame(data) {
    myGrid = Array.isArray(data.grid)
        ? data.grid
        : myGrid;

    enemyGrid = createEmptyGrid();

    const firstPlayer =
        data.firstPlayer ||
        data.currentPlayerId ||
        data.playerId ||
        null;

    isMyTurn = firstPlayer === playerId;

    document.getElementById("myName").textContent = playerName;

    document.getElementById("turnText").textContent =
        isMyTurn ? "دورك" : "دور الخصم";

    renderBoards();
    showScreen("gameScreen");
}

function renderBoards() {
    const myBoard = document.getElementById("myBoard");
    const enemyBoard = document.getElementById("enemyBoard");

    myBoard.innerHTML = "";
    enemyBoard.innerHTML = "";

    for (let row = 0; row < 10; row++) {
        for (let col = 0; col < 10; col++) {
            const myCell = document.createElement("div");
            myCell.className = "cell";

            if (myGrid[row][col] === "ship") {
                myCell.classList.add("ship");
            }

            if (myGrid[row][col] === "hit") {
                myCell.classList.add("hit");
            }

            if (myGrid[row][col] === "miss") {
                myCell.classList.add("miss");
            }

            myBoard.appendChild(myCell);

            const enemyCell = document.createElement("div");
            enemyCell.className = "cell";

            if (enemyGrid[row][col] === "hit") {
                enemyCell.classList.add("hit");
            }

            if (enemyGrid[row][col] === "miss") {
                enemyCell.classList.add("miss");
            }

            enemyCell.addEventListener("click", function() {
                attack(row, col);
            });

            enemyBoard.appendChild(enemyCell);
        }
    }
}

function attack(row, col) {
    if (!isMyTurn) {
        setStatus("gameStatus", "ليس دورك الآن");
        return;
    }

    if (enemyGrid[row][col] !== "") {
        setStatus("gameStatus", "هاجمت هذه الخانة من قبل");
        return;
    }

    if (!currentRoom) {
        setStatus("gameStatus", "لا توجد غرفة");
        return;
    }

    sendMessage({
        type: "attack",
        roomId: currentRoom,
        row: row,
        col: col
    });
}

function applyAttackResult(data) {
    const row = Number(data.row);
    const col = Number(data.col);

    if (
        !Number.isInteger(row) ||
        !Number.isInteger(col) ||
        row < 0 ||
        row >= 10 ||
        col < 0 ||
        col >= 10
    ) {
        return;
    }

    const attackerId =
        data.attackerId ||
        data.playerId ||
        null;

    if (attackerId === playerId) {
        enemyGrid[row][col] = data.hit ? "hit" : "miss";
    } else {
        myGrid[row][col] = data.hit ? "hit" : "miss";
    }

    const nextPlayerId =
        data.nextPlayerId ||
        data.currentPlayerId ||
        null;

    isMyTurn = nextPlayerId === playerId;

    document.getElementById("turnText").textContent =
        isMyTurn ? "دورك" : "دور الخصم";

    renderBoards();
}

function randomizeShips() {
    myGrid = createEmptyGrid();

    ships.forEach(ship => {
        ship.cells = [];
    });

    ships.forEach(ship => {
        let placed = false;
        let attempts = 0;

        while (!placed && attempts < 1000) {
            attempts++;

            const horizontal = Math.random() > 0.5;
            const row = Math.floor(Math.random() * 10);
            const col = Math.floor(Math.random() * 10);
            const cells = [];

            for (let i = 0; i < ship.size; i++) {
                const r = horizontal ? row : row + i;
                const c = horizontal ? col + i : col;

                if (
                    r < 0 ||
                    r >= 10 ||
                    c < 0 ||
                    c >= 10 ||
                    myGrid[r][c] !== ""
                ) {
                    cells.length = 0;
                    break;
                }

                cells.push([r, c]);
            }

            if (cells.length === ship.size) {
                cells.forEach(([r, c]) => {
                    myGrid[r][c] = "ship";
                });

                ship.cells = cells;
                placed = true;
            }
        }
    });

    renderBoards();
}

randomizeShips();
</script>

</body>
</html>
